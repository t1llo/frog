# Fails when a key, token or password is anywhere in the Git history.
# Findings are redacted in the log. False positives: add their fingerprint to .gitleaksignore.
name: Secret scan

# Runs on pushes to the default branch and on pull requests only (feature-branch pushes get scanned
# through their PR), to save Actions minutes. A newer push cancels a scan still running.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true


permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v$VERSION"
          curl -sSfLO "$base/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/gitleaks_${VERSION}_checksums.txt"
          sha256sum -c --ignore-missing "gitleaks_${VERSION}_checksums.txt"
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks

      - name: Scan the whole history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
