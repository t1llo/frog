# Fails when a key, token or password is anywhere in the Git history.
# Findings are redacted in the log. False positives: add their fingerprint to .gitleaksignore.
name: Secret scan

# Saves Actions minutes. Private repositories are scanned only when something lands on main/master
# (a merge or a direct push); their pull requests skip the job, which costs nothing. Public
# repositories get free minutes, so their pull requests are scanned too. Feature-branch pushes
# never run it. Start a scan by hand with `gh workflow run secret-scan.yml`.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    if: github.event_name != 'pull_request' || !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        id: install
        env:
          VERSION: 8.30.1
        # GitHub release downloads sometimes fail from the runners for a while (504s): then the scan uses
        # gitleaks' own image on ghcr.io, same version.
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v$VERSION"
          if curl -sSfLO --retry 3 --retry-all-errors --retry-delay 10 "$base/gitleaks_${VERSION}_linux_x64.tar.gz" \
            && curl -sSfLO --retry 3 --retry-all-errors --retry-delay 10 "$base/gitleaks_${VERSION}_checksums.txt"; then
            sha256sum -c --ignore-missing "gitleaks_${VERSION}_checksums.txt"
            tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
            echo "cmd=./gitleaks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::gitleaks download failed; using ghcr.io/gitleaks/gitleaks:v$VERSION"
            docker pull "ghcr.io/gitleaks/gitleaks:v$VERSION"
            echo "cmd=docker run --rm --user $(id -u):$(id -g) -v $PWD:/repo -w /repo ghcr.io/gitleaks/gitleaks:v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan the whole history
        run: ${{ steps.install.outputs.cmd }} git --redact --verbose --exit-code 1 .
