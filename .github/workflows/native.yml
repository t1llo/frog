name: Native macOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain
        run: swift --version
      - name: Build and test native app
        run: swift test
      - name: Package application
        run: bash scripts/build-app.sh
        env:
          FROG_UNIVERSAL: "1"
      - name: Build Xcode project
        run: xcodebuild -project native/Frog.xcodeproj -scheme Frog-macOS -configuration Debug -destination 'platform=macOS' -skipPackagePluginValidation -derivedDataPath .build/xcode build
      - name: Verify packaged app launches
        run: python3 scripts/check-app-launch.py dist/Frog.app
      - uses: actions/upload-artifact@v4
        with:
          name: Frog-macOS
          path: |
            dist/Frog-macOS.zip
            dist/SHA256SUMS
