name: Native macOS
# A run takes about 25 macOS minutes, so pushes to main don't start it: every change is tested locally first
# (AGENTS.md). Run it with `gh workflow run native.yml` before a release, or open a pull request.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A newer commit on the same branch or pull request replaces a run still in progress.
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Verify toolchain
        run: swift --version
      - name: Install Metal compiler
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
      - name: Build and test native app
        # Frame-budget tests must measure the optimized app we ship.
        run: swift test -c release
      - name: Package application
        run: bash scripts/build-app.sh
        env:
          FROG_UNIVERSAL: "1"
      - name: Build Xcode project
        run: xcodebuild -project native/Frog.xcodeproj -scheme Frog-macOS -configuration Debug -destination 'platform=macOS' -skipPackagePluginValidation -derivedDataPath .build/xcode build
      - name: Verify packaged app launches
        run: python3 scripts/check-app-launch.py dist/Frog.app
      - name: Verify the frog tool reaches the packaged app
        run: python3 scripts/check-agent-cli.py dist/Frog.app
      - uses: actions/upload-artifact@v4
        with:
          name: Frog-macOS
          path: |
            dist/Frog-macOS.zip
            dist/SHA256SUMS
