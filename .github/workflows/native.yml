name: Native macOS
# Builds, tests and packages the app on GitHub's macOS runner (free for this public repository).
# A run takes about 25 minutes: three release compiles (tests, the universal app, the Xcode project).
# Pushes to main run it too, so a change that breaks the build or a test shows up the same day.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
# A newer commit on the same branch or pull request replaces a run still in progress.
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify toolchain
        run: swift --version
      # Only downloaded package sources and binaries are cached, never build products,
      # so a stale cache can make a run slower but never change what it builds.
      - name: Restore package downloads
        uses: actions/cache@v4
        with:
          path: |
            .build/repositories
            .build/checkouts
            .build/artifacts
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Install Metal compiler
        run: |
          xcodebuild -downloadComponent MetalToolchain
          xcrun metal --version
      - name: Build and test native app
        # Frame-budget tests must measure the optimized app we ship.
        run: swift test -c release
        env:
          # No one works on the runner's screen, so the tests that show windows run here too.
          FROG_ON_SCREEN_TESTS: "1"
      - name: Package application
        run: bash scripts/build-app.sh
        env:
          FROG_UNIVERSAL: "1"
      - name: Build Xcode project
        run: xcodebuild -project native/Frog.xcodeproj -scheme Frog-macOS -configuration Debug -destination 'platform=macOS' -skipPackagePluginValidation -derivedDataPath .build/xcode build
      - name: Verify packaged app launches
        run: python3 scripts/check-app-launch.py dist/Frog.app
      - name: Verify the frog tool reaches the packaged app
        run: python3 scripts/check-agent-cli.py dist/Frog.app
      - uses: actions/upload-artifact@v4
        with:
          name: Frog-macOS
          path: |
            dist/Frog-macOS.zip
            dist/SHA256SUMS
