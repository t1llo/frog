<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Focus timer</title>
  <link rel="stylesheet" href="/_frog/frog.css">
  <style>
    .heading { display: flex; align-items: baseline; gap: 8px; }
    .heading strong { flex: 1; font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>
  <main class="frog-page">
    <p id="error" class="frog-error" role="alert" hidden></p>
    <div class="frog-stack" style="--gap: 2px">
      <div class="heading">
        <strong id="mode">Focus</strong>
        <span id="today" class="frog-small frog-muted frog-tabular"></span>
      </div>
      <div id="time" class="frog-figure" role="timer">25:00</div>
    </div>
    <div id="progress" class="frog-meter" style="--value: 0" aria-hidden="true"></div>
    <div class="frog-row">
      <span id="status" class="frog-muted">Ready</span>
      <span class="frog-spacer"></span>
      <button id="reset" class="frog-quiet">Reset</button>
      <button id="toggle" class="frog-primary">Start</button>
    </div>
  </main>
  <script src="timer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
